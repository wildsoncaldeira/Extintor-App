<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Arredondado com Gradiente Vermelho -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Detalhe de Brilho Superior -->
  <path d="M 112 0 L 400 0 Q 512 0 512 112 L 512 180 Q 256 120 0 180 L 0 112 Q 0 0 112 0 Z" fill="white" opacity="0.08" />

  <!-- Grupo do Extintor -->
  <g transform="translate(256, 275)" filter="url(#shadow)">
    <!-- Corpo Principal do Extintor -->
    <rect x="-65" y="-95" width="130" height="235" rx="60" fill="white" />
    
    <!-- Faixa decorativa interna do cilindro -->
    <rect x="-65" y="-30" width="130" height="42" fill="#ef4444" opacity="0.9" />
    
    <!-- Válvula / Gargalo -->
    <rect x="-24" y="-132" width="48" height="42" rx="6" fill="url(#metalGrad)" />
    
    <!-- Manômetro (relógio de pressão) -->
    <circle cx="34" cy="-115" r="16" fill="url(#metalGrad)" stroke="#991b1b" stroke-width="3" />
    <circle cx="34" cy="-115" r="4" fill="#15803d" />
    <line x1="34" y1="-115" x2="40" y2="-123" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />

    <!-- Alavanca de Disparo (Trigger) -->
    <path d="M -35 -142 Q 0 -168 45 -152 Q 25 -136 5 -135 Z" fill="url(#metalGrad)" />
    
    <!-- Alça de Transporte -->
    <path d="M -38 -128 Q -48 -148 -25 -155 Q -15 -140 -20 -126 Z" fill="url(#metalGrad)" />

    <!-- Mangueira curvada com bico -->
    <path d="M -24 -115 C -85 -115 -85 55 -65 105" fill="none" stroke="url(#metalGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M -68 95 L -62 120 L -46 112 Z" fill="url(#metalGrad)" />

    <!-- Chaminha decorativa no centro da faixa -->
    <path d="M 0 -22 C 12 -14 18 -2 18 10 C 18 20 10 24 0 24 C -10 24 -18 20 -18 10 C -18 -2 -12 -14 0 -22 Z" fill="white" />
    <path d="M 0 -8 C 6 -3 9 4 9 10 C 9 15 5 17 0 17 C -5 17 -9 15 -9 10 C -9 4 -6 -3 0 -8 Z" fill="#ef4444" />
  </g>
</svg>
